name: bikes_app
description: "App para gestionar rentas de bicicletas: Flutter, Riverpod, go_router y Clean Architecture."
publish_to: "none"

version: 2.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  qr_code_scanner_plus: ^2.0.10+1
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
